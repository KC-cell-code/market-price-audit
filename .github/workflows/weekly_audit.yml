name: Weekly Audit Report

on:
  workflow_dispatch:

jobs:
  run-report-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required Python packages
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pandas matplotlib requests fpdf2 cloudscraper beautifulsoup4

      - name: Run weekly report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
        run: python weekly_report.py
