name: Run Weekly Email Script

'on':
  schedule:
    - cron: '20 15 * * *'
  workflow_dispatch:

jobs:
  run-report-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required Python packages
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth reportlab pandas beautifulsoup4 requests fpdf2 matplotlib

      - name: Recreate google_credentials.json from secret
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: |
          echo "$GOOGLE_SHEETS_CREDS" > google_credentials.json

      - name: Run weekly report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python weekly_report.py
